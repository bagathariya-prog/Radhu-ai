<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Radhu - Personal AI Companion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #111827; color: white; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
    header { text-align: center; padding: 15px; background: #1f2937; border-bottom: 1px solid #374151; }
    header h1 { font-size: 20px; }
    #chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .message { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 15px; line-height: 1.4; }
    .user-msg { align-self: flex-end; background-color: #2563eb; color: white; border-bottom-right-radius: 2px; }
    .bot-msg { align-self: flex-start; background-color: #374151; color: white; border-bottom-left-radius: 2px; }
    .input-container { display: flex; padding: 10px; background: #1f2937; border-top: 1px solid #374151; }
    input { flex: 1; padding: 12px; border: none; border-radius: 8px; outline: none; background: #374151; color: white; font-size: 15px; }
    button { margin-left: 8px; padding: 12px 18px; border: none; background: #2563eb; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; }
    button:active { opacity: 0.8; }
  </style>
</head>
<body>

  <header>
    <h1>🤖 Radhu</h1>
    <p style="font-size: 12px; color: #9ca3af;">Your Personal AI Companion 💛</p>
  </header>

  <div id="chat-box">
    <div class="message bot-msg">
      Hii Yash! 😄 Main Radhu hoon. Aaj su kariye?
    </div>
  </div>

  <div class="input-container">
    <input type="text" id="userInput" placeholder="Ask Radhu something..." onkeypress="handleKeyPress(event)" />
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    // ⚠️ અહીં તમારી નવી Groq API Key ના બે ભાગ કરો:
    const keyPart1 = "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"; 
    const keyPart2 = "fYbVIpTbvPlkEEeD7izxpoppnL";
    
    const API_KEY = keyPart1 + keyPart2;

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const text = input.value.trim();
      if (!text) return;

      appendMessage(text, "user-msg");
      input.value = "";

      const loadingDiv = appendMessage("Thinking...", "bot-msg");

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${API_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "model: "llama3-70b-8192",
    ",
            messages: [
              {
                role: "system",
                content: "તમારું નામ Radhu છે. તમે Yash ના પર્સનલ AI companion છો. ફ્રેન્ડલી અને કાળજીપૂર્વક વાત કરો."
              },
              { role: "user", content: text }
            ]
          })
        });

        const data = await response.json();
        
        if (data.choices && data.choices[0]) {
          loadingDiv.innerText = data.choices[0].message.content;
        } else {
          loadingDiv.innerText = "અરેરે! API Key માં ભૂલ છે, ચેક કરો.";
        }

      } catch (error) {
        loadingDiv.innerText = "અરેરે! કનેક્શનમાં ભૂલ આવી છે.";
      }
    }

    function appendMessage(text, className) {
      const chatBox = document.getElementById("chat-box");
      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${className}`;
      msgDiv.innerText = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msgDiv;
    }

    function handleKeyPress(event) {
      if (event.key === "Enter") sendMessage();
    }
  </script>
</body>
</html>
