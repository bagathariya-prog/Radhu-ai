<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Radhu - Personal AI Companion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #111827; color: white; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
    header { text-align: center; padding: 15px; background: #1f2937; border-bottom: 1px solid #374151; }
    header h1 { font-size: 20px; }
    
    .key-container { padding: 10px; background: #374151; display: flex; gap: 8px; justify-content: center; }
    .key-container input { padding: 8px; border-radius: 6px; border: none; font-size: 13px; width: 70%; background: #1f2937; color: white; }
    .key-container button { padding: 8px 12px; background: #10b981; border: none; color: white; border-radius: 6px; cursor: pointer; font-weight: bold; }

    #chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .message { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 15px; line-height: 1.4; }
    .user-msg { align-self: flex-end; background-color: #2563eb; color: white; border-bottom-right-radius: 2px; }
    .bot-msg { align-self: flex-start; background-color: #374151; color: white; border-bottom-left-radius: 2px; }
    .input-container { display: flex; padding: 10px; background: #1f2937; border-top: 1px solid #374151; }
    .input-container input { flex: 1; padding: 12px; border: none; border-radius: 8px; outline: none; background: #374151; color: white; font-size: 15px; }
    .input-container button { margin-left: 8px; padding: 12px 18px; border: none; background: #2563eb; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <h1>🤖 Radhu</h1>
    <p style="font-size: 12px; color: #9ca3af;">Your Personal AI Companion 💛</p>
  </header>

  <div class="key-container">
    <input type="password" id="apiKeyInput" placeholder="અહીં Gemini API Key પેસ્ટ કરો..." />
    <button onclick="saveKey()">Save Key</button>
  </div>

  <div id="chat-box">
    <div class="message bot-msg">
      Hii Yash! 😄 Main Radhu hoon. Pehle upar API Key save karo, fir baate karte hai!
    </div>
  </div>

  <div class="input-container">
    <input type="text" id="userInput" placeholder="Ask Radhu something..." onkeypress="handleKeyPress(event)" />
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    window.onload = function() {
      const savedKey = localStorage.getItem("radhu_api_key");
      if (savedKey) {
        document.getElementById("apiKeyInput").value = savedKey;
      }
    };

    function saveKey() {
      const key = document.getElementById("apiKeyInput").value.trim();
      if (key) {
        localStorage.setItem("radhu_api_key", key);
        alert("API Key સફળતાપૂર્વક Save થઈ ગઈ છે!");
      } else {
        alert("મહેરબાની કરીને સાચી API Key દાખલ કરો.");
      }
    }

    async function sendMessage() {
      const API_KEY = localStorage.getItem("radhu_api_key");
      if (!API_KEY) {
        alert("પહેલા ઉપર તમારી API Key ઉમેરીને Save Key પર ક્લિક કરો!");
        return;
      }

      const input = document.getElementById("userInput");
      const text = input.value.trim();
      if (!text) return;

      appendMessage(text, "user-msg");
      input.value = "";

      const loadingDiv = appendMessage("Thinking...", "bot-msg");

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [
              {
                role: "user",
                parts: [
                  { text: "તમારું નામ Radhu છે. તમે Yash ના પર્સનલ AI companion છો. ફ્રેન્ડલી અને કાળજીપૂર્વક વાત કરો." },
                  { text: text }
                ]
              }
            ]
          })
        });

        const data = await response.json();

        if (data.candidates && data.candidates[0].content.parts[0].text) {
          loadingDiv.innerText = data.candidates[0].content.parts[0].text;
        } else if (data.error) {
          loadingDiv.innerText = "Error: " + data.error.message;
        } else {
          loadingDiv.innerText = "અરેરે! API કી ચકાસો.";
        }

      } catch (error) {
        loadingDiv.innerText = "કનેક્શનમાં ભૂલ આવી છે.";
      }
    }

    function appendMessage(text, className) {
      const chatBox = document.getElementById("chat-box");
      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${className}`;
      msgDiv.innerText = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msgDiv;
    }

    function handleKeyPress(event) {
      if (event.key === "Enter") sendMessage();
    }
  </script>
</body>
</html>
