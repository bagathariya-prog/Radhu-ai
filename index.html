<!DOCTYPE html>
 <html lang="gu">
 <head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">

 <title>Radhu - Personal AI Companion</title>

 <style>
 * {
 box-sizing: border-box;
 margin: 0;
 padding: 0;
 font-family: Arial, sans-serif;
 }

 body {
 background-color: #111827;
 color: white;
 height: 100vh;
 display: flex;
 flex-direction: column;
 }

 header {
 text-align: center;
 padding: 15px;
 background: #1f2937;
 border-bottom: 1px solid #374151;
 }

 header h1 {
 font-size: 20px;
 }

 header p {
 margin-top: 4px;
 font-size: 12px;
 color: #9ca3af;
 }

 #chat-box {
 flex: 1;
 padding: 15px;
 overflow-y: auto;
 display: flex;
 flex-direction: column;
 gap: 10px;
 }

 .message {
 max-width: 80%;
 padding: 10px 14px;
 border-radius: 12px;
 font-size: 15px;
 line-height: 1.5;
 white-space: pre-wrap;
 word-wrap: break-word;
 }

 .user-msg {
 align-self: flex-end;
 background-color: #2563eb;
 color: white;
 border-bottom-right-radius: 2px;
 }

 .bot-msg {
 align-self: flex-start;
 background-color: #374151;
 color: white;
 border-bottom-left-radius: 2px;
 }

 .error-msg {
 background-color: #7f1d1d;
 }

 .typing {
 opacity: 0.7;
 font-style: italic;
 }

 .input-container {
 display: flex;
 padding: 10px;
 background: #1f2937;
 border-top: 1px solid #374151;
 }

 #userInput {
 flex: 1;
 padding: 12px;
 border: none;
 border-radius: 8px;
 outline: none;
 background: #374151;
 color: white;
 font-size: 15px;
 }

 #userInput::placeholder {
 color: #9ca3af;
 }

 #sendButton {
 margin-left: 8px;
 padding: 12px 18px;
 border: none;
 background: #2563eb;
 color: white;
 font-weight: bold;
 border-radius: 8px;
 cursor: pointer;
 }

 #sendButton:hover {
 background-color: #1d4ed8;
 }

 #sendButton:active {
 opacity: 0.8;
 }

 #sendButton:disabled {
 opacity: 0.6;
 cursor: not-allowed;
 }
 </style>
 </head>

<body>

 <header>
 <h1>🤖 Radhu</h1>
 <p>Your Personal AI Companion 💛</p>
 </header>

 <div id="chat-box">

 <div class="message bot-msg">
 Hii Yash! 😄 Main Radhu hoon. Aaj su kariye?
 </div>

 </div>

 <div class="input-container">

 <input
 type="text"
 id="userInput"
 placeholder="Ask Radhu something..."
 autocomplete="off"
 >

 <button id="sendButton">
 Send
 </button>

 </div>

 <script>

 // =========================================================
 // GROQ API KEY
 // =========================================================
 //
 // IMPORTANT:
 // Replace this with a FRESH API KEY.
 //
 // NEVER share this key publicly.
 //
 const API_KEY = "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";

 // =========================================================
 // GROQ CONFIGURATION
 // =========================================================

 const API_URL =
 "https://api.groq.com/openai/v1/chat/completions";

 const MODEL =
 "llama-3.1-8b-instant";

 // =========================================================
 // CONVERSATION HISTORY
 // =========================================================

 const messages = [

 {
 role: "system",

 content:
 "તમારું નામ Radhu છે. " +
 "તમે Yash ના ફ્રેન્ડલી પર્સનલ AI companion છો. " +
 "ખુશમિજાજ અને કાળજીપૂર્વક વાત કરો. " +
 "યુઝર જે પણ ભાષા (ગુજરાતી, હિન્દી કે Gujlish) માં વાત કરે " +
 "તેમાં જ સહજતાથી જવાબ આપો."
 }

 ];

 // =========================================================
 // DOM ELEMENTS
 // =========================================================

 const chatBox =
 document.getElementById("chat-box");

 const userInput =
 document.getElementById("userInput");

 const sendButton =
 document.getElementById("sendButton");

 // =========================================================
 // ADD MESSAGE TO CHAT
 // =========================================================

 function appendMessage(text, className) {

 const messageDiv =
 document.createElement("div");

 messageDiv.className =
 `message ${className}`;

 messageDiv.innerText =
 text;

 chatBox.appendChild(
 messageDiv
 );

 chatBox.scrollTop =
 chatBox.scrollHeight;

 return messageDiv;
 }

 // =========================================================
 // SEND MESSAGE
 // =========================================================

 async function sendMessage() {

 const text =
 userInput.value.trim();

 // Don't send empty message
 if (!text) {
 return;
 }

 // Don't allow another request
 // while current request is running
 sendButton.disabled = true;

 // Display user message
 appendMessage(
 text,
 "user-msg"
 );

 // Clear input
 userInput.value = "";

 // Add user message to conversation
 messages.push({

 role: "user",

 content: text

 });

 // Show loading message
 const loadingMessage =
 appendMessage(
 "Thinking...",
 "bot-msg typing"
 );

 try {

 // =================================================
 // CHECK API KEY
 // =================================================

 if (
 !API_KEY ||
 API_KEY === "PASTE_YOUR_NEW_GROQ_KEY_HERE"
 ) {

 throw new Error(
 "Groq API key is missing. " +
 "Please add your API key in the HTML file."
 );

 }

 // =================================================
 // CALL GROQ API
 // =================================================

 const response =
 await fetch(
 API_URL,
 {

 method: "POST",

 headers: {

 "Authorization":
 `Bearer ${API_KEY}`,

 "Content-Type":
 "application/json"

 },

 body:
 JSON.stringify({

 model:
 MODEL,

 messages:
 messages,

 temperature:
 0.7,

 max_tokens:
 1024

 })

 }
 );

 // =================================================
 // READ RESPONSE
 // =================================================

 const data =
 await response.json();

 // Useful for debugging
 console.log(
 "Groq HTTP Status:",
 response.status
 );

 console.log(
 "Groq Response:",
 data
 );

 // =================================================
 // HANDLE API ERROR
 // =================================================

 if (!response.ok) {

 const errorMessage =
 data?.error?.message ||
 "Groq API request failed.";

 throw new Error(
 `Groq Error (${response.status}): ${errorMessage}`
 );

 }

 // =================================================
 // GET AI RESPONSE
 // =================================================

 const reply =
 data?.choices?.[0]?.message?.content;

 if (!reply) {

 throw new Error(
 "Groq returned an empty response."
 );

 }

 // Remove typing style
 loadingMessage.classList.remove(
 "typing"
 );

 // Display AI response
 loadingMessage.innerText =
 reply;

 // Add AI response to history
 messages.push({

 role: "assistant",

 content: reply

 });

 }

 catch (error) {

 console.error(
 "Radhu Error:",
 error
 );

 // Remove typing style
 loadingMessage.classList.remove(
 "typing"
 );

 // Show error styling
 loadingMessage.classList.add(
 "error-msg"
 );

 // Show actual error
 loadingMessage.innerText =
 "અરેરે! 😔\n\n" +
 error.message;

 // Remove failed user message
 // from conversation history
 messages.pop();

 }

 finally {

 // Enable button again
 sendButton.disabled =
 false;

 // Focus input
 userInput.focus();

 // Scroll chat to bottom
 chatBox.scrollTop =
 chatBox.scrollHeight;

 }

 }

 // =========================================================
 // SEND BUTTON
 // =========================================================

 sendButton.addEventListener(
 "click",
 sendMessage
 );

 // =========================================================
 // ENTER KEY
 // =========================================================

 userInput.addEventListener(
 "keydown",
 function (event) {

 if (
 event.key === "Enter"
 ) {

 event.preventDefault();

 sendMessage();

 }

 }
 );

 // =========================================================
 // INITIAL FOCUS
 // =========================================================

 userInput.focus();

 </script>

</body>
 </html>
